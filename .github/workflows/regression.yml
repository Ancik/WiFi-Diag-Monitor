name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test with Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/Test-WiFiDiag.ps1
      - name: Test with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/Test-WiFiDiag.ps1
